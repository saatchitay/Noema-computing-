<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NOEMA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="NOEMA is an early-stage, experimental research venture toward computational scientific discovery: AI systems that generate, challenge and refine scientific hypotheses.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Hanken+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a research-institution folio. A narrow mono margin carries annotations (figure numbers, status, units) beside a wide reading column; one live mathematical figure opens the page; the Discovery Engine is laid out as an instrument panel. */
:root{
  color-scheme: dark;
  --ink:#06070A;
  --ink-2:#0A0C10;
  --panel:#0D1015;
  --panel-2:#12161D;
  --ivory:#ECE6D8;
  --ivory-2:#BDB8AC;
  --ivory-3:#86847D;
  --ivory-4:#4E4E4B;
  --line:rgba(236,230,216,.09);
  --line-2:rgba(236,230,216,.18);
  --blue:#8DB0DF;
  --blue-2:#5F86BC;
  --blue-soft:rgba(141,176,223,.10);
  --blue-line:rgba(141,176,223,.35);
  --amber:#D2B077;
  --rose:#C9907F;
  --f-display:"Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  --f-body:"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --maxw:1200px;
  --gut:clamp(16px, 4vw, 44px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--ink);color:var(--ivory);font-family:var(--f-body);font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
::selection{background:var(--blue-2);color:var(--ink)}
a{color:inherit}
:focus-visible{outline:1px solid var(--blue);outline-offset:3px;border-radius:2px}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(var(--gut), env(safe-area-inset-left,0px));padding-right:max(var(--gut), env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ivory-3)}
.mono b{color:var(--ivory-2);font-weight:500}
h1,h2,h3{font-family:var(--f-display);font-weight:300;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
em{font-style:italic}

/* NAV */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(6,7,10,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:24px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand-word{font-family:var(--f-display);font-size:21px;font-weight:500;letter-spacing:.32em;padding-left:.1em}
.brand-mark{width:22px;height:22px}
.navlinks{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.navlinks a{display:block;text-decoration:none;font-size:13px;color:var(--ivory-3);padding:8px 12px;border-radius:999px;transition:color .2s, background .2s}
.navlinks a:hover{color:var(--ivory)}
.navlinks a.on{color:var(--ivory);background:rgba(236,230,216,.05)}
.navlinks a.engine-link{color:var(--blue)}
.navlinks a.engine-link.on{background:var(--blue-soft)}
.menu-btn{display:none;background:none;border:1px solid var(--line-2);color:var(--ivory-2);font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:8px 12px;border-radius:999px;cursor:pointer}
@media (max-width:1080px){
  .menu-btn{display:block}
  .navlinks{display:none;position:absolute;left:0;right:0;top:62px;flex-direction:column;background:var(--ink-2);border-bottom:1px solid var(--line);padding:8px max(var(--gut), env(safe-area-inset-left,0px)) 16px}
  .navlinks.open{display:flex}
  .navlinks a{padding:12px 0;border-radius:0;font-size:15px;border-bottom:1px solid var(--line)}
  .navlinks a.on{background:none}
}

/* SECTIONS */
section{border-bottom:1px solid var(--line)}
.sec{padding-block:clamp(72px,10vw,132px)}
.sec-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:clamp(24px,5vw,72px)}
.margin{display:flex;flex-direction:column;gap:10px;padding-top:10px}
.margin .rule{width:28px;height:1px;background:var(--blue-line)}
@media (max-width:860px){.sec-grid{grid-template-columns:minmax(0,1fr)}.margin{flex-direction:row;align-items:center;gap:14px;padding-top:0}}
.h2{font-size:clamp(38px,5.4vw,64px);line-height:1.04;max-width:16ch}
.h2 em{color:var(--ivory-2)}
.lede{font-size:clamp(17px,1.6vw,19px);color:var(--ivory-2);max-width:62ch;line-height:1.65;font-weight:300}

/* HERO */
.hero{position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(24px,4vw,56px);align-items:center;padding-block:clamp(56px,8vw,112px) clamp(56px,7vw,96px)}
.hero-copy{display:flex;flex-direction:column;gap:30px;min-width:0}
.hero h1{font-size:clamp(52px,8.2vw,112px);line-height:.96;letter-spacing:-.02em;font-weight:300}
.hero h1 .l2{display:block;font-style:italic;color:var(--ivory-2)}
.hero h1 .l2 span{color:var(--blue)}
.lede.quote{font-family:var(--f-display);font-style:italic;font-size:clamp(21px,2.1vw,26px);line-height:1.4;color:var(--ivory);max-width:46ch}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-body);font-size:14px;font-weight:500;text-decoration:none;padding:13px 20px;border-radius:999px;border:1px solid var(--line-2);color:var(--ivory);background:transparent;cursor:pointer;transition:border-color .2s, background .2s, color .2s}
.btn:hover{border-color:var(--ivory-3)}
.btn.primary{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}
.btn.primary:hover{background:#fff}
.btn.blue{border-color:var(--blue-line);color:var(--blue)}
.btn.blue:hover{background:var(--blue-soft)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .arr{transition:transform .25s}
.btn:hover .arr{transform:translateX(3px)}
.status{display:flex;gap:14px;align-items:flex-start;border-top:1px solid var(--line);padding-top:20px;max-width:58ch}
.pulse{flex:none;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-top:8px;box-shadow:0 0 0 0 var(--blue-line);animation:pulse 2.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(141,176,223,.45)}70%{box-shadow:0 0 0 9px rgba(141,176,223,0)}100%{box-shadow:0 0 0 0 rgba(141,176,223,0)}}
.status p{font-size:14px;color:var(--ivory-3);line-height:1.6}
.status p b{color:var(--ivory-2);font-weight:500}
.figure{position:relative;min-width:0}
.figure canvas{display:block;width:100%;aspect-ratio:1/1;max-width:100%}
.fig-cap{display:flex;flex-direction:column;gap:6px;margin-top:6px;border-top:1px solid var(--line);padding-top:14px}
.fig-cap p{font-size:13px;color:var(--ivory-3);line-height:1.55;max-width:46ch}
.eq{font-family:var(--f-mono);font-size:11.5px;color:var(--ivory-3);display:flex;flex-wrap:wrap;gap:6px 18px}
.eq span i{font-style:italic;color:var(--ivory-2)}
@media (max-width:860px){.hero .wrap{grid-template-columns:minmax(0,1fr)}.figure canvas{aspect-ratio:4/3}}

/* RESEARCH PROGRAMS */
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:40px;border:1px solid var(--line);border-radius:4px}
.level{padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.level + .level{border-left:1px solid var(--line)}
.lv-top{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500}
.lv-top b{margin-left:auto;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.level p{font-size:13.5px;color:var(--ivory-3);line-height:1.55}
@media (max-width:760px){.levels{grid-template-columns:minmax(0,1fr)}.level + .level{border-left:none;border-top:1px solid var(--line)}}
.pindex{display:flex;flex-direction:column;margin-top:36px;border-top:1px solid var(--line)}
.pindex a{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;transition:padding .25s, background .25s}
.pindex a:hover{padding-left:10px;background:linear-gradient(90deg,var(--blue-soft),transparent 70%)}
.pi-n{font-family:var(--f-display);font-style:italic;font-size:22px;color:var(--blue)}
.pi-name{font-family:var(--f-display);font-size:clamp(22px,2.4vw,28px);line-height:1.15}
.pi-st{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ivory-3)}
.programs{margin-top:clamp(56px,7vw,96px);display:flex;flex-direction:column}
.prog{border-top:1px solid var(--line-2);padding-block:clamp(40px,5vw,64px);scroll-margin-top:72px}
.prog-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(16px,3vw,36px);align-items:start}
.prog-n{font-family:var(--f-display);font-style:italic;font-weight:300;font-size:clamp(56px,7vw,92px);line-height:.8;color:var(--blue);min-width:1.3em}
.prog-title{display:flex;flex-direction:column;gap:10px;min-width:0}
.prog-title h3{font-size:clamp(34px,4.2vw,52px);line-height:1.02}
.prog-title p{font-size:17px;color:var(--ivory-2);font-weight:300;max-width:56ch}
.track{display:flex;gap:4px;flex-wrap:wrap;padding-top:8px}
.track span{display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ivory-4);padding:5px 9px;border:1px solid var(--line);border-radius:999px}
.track span.cur{color:var(--blue);border-color:var(--blue-line)}
@media (max-width:860px){.prog-head{grid-template-columns:auto minmax(0,1fr)}.track{grid-column:1/-1}}
.prog-body{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:clamp(28px,4vw,56px);margin-top:40px;align-items:start}
@media (max-width:1040px){.prog-body{grid-template-columns:minmax(0,1fr)}}
.prog-text{display:flex;flex-direction:column;gap:26px;min-width:0}
.formal{display:flex;flex-direction:column;gap:12px;padding:20px 22px;border:1px solid var(--line);border-left:1px solid var(--blue-line);background:var(--ink-2);border-radius:0 4px 4px 0;overflow-x:auto}
.fx{font-family:var(--f-display);font-size:clamp(20px,2vw,24px);line-height:1.4;color:var(--ivory);white-space:nowrap}
.fx i{font-style:italic}
.fx sub,.fx sup{font-size:.62em}
.fnote{font-size:13.5px;color:var(--ivory-3);line-height:1.6}
.fnote i{font-family:var(--f-display);font-size:1.15em}
.pdl{margin:0;display:flex;flex-direction:column}
.pdl > div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;padding:14px 0;border-top:1px solid var(--line)}
.pdl dt{padding-top:4px}
.pdl dd{margin:0;font-size:15px;color:var(--ivory-2);line-height:1.62}
.pdl ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.pdl li{font-family:var(--f-display);font-style:italic;font-size:19px;line-height:1.35;color:var(--ivory)}
@media (max-width:560px){.pdl > div{grid-template-columns:minmax(0,1fr);gap:6px}}
.pstat{color:var(--ivory-4)}
.prog-viz{min-width:0;position:sticky;top:84px}
@media (max-width:1040px){.prog-viz{position:static}}

/* VIZ */
.viz{margin:0;border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden;container-type:inline-size}
.viz-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 16px;border-bottom:1px solid var(--line)}
.vtag{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);border:1px dashed var(--blue-line);padding:3px 7px;border-radius:2px}
.viz-body{padding:14px 12px 6px;background:radial-gradient(circle at 50% 40%, rgba(141,176,223,.05), transparent 65%)}
.viz-body svg{display:block;width:100%;height:auto;max-width:100%}
.viz-2{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@container (min-width:600px){.viz-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.viz-read{display:flex;flex-wrap:wrap;gap:6px 18px;padding:12px 16px;border-top:1px solid var(--line);font-family:var(--f-mono);font-size:11.5px;color:var(--ivory-2);font-variant-numeric:tabular-nums;min-height:44px;align-items:center}
.viz-read i{font-style:normal;color:var(--ivory-3);margin-left:4px}
.viz-read .hl{color:var(--blue)}.viz-read .rose{color:var(--rose)}.viz-read .blue{color:var(--blue)}
.viz-ctl{display:flex;flex-wrap:wrap;gap:16px 24px;padding:14px 16px 18px;border-top:1px solid var(--line)}
.sl{display:flex;flex-direction:column;gap:8px;flex:1 1 200px;min-width:0}
.sl-top{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ivory-3)}
.sl-top b{font-family:var(--f-mono);font-weight:500;color:var(--ivory);font-variant-numeric:tabular-nums}
.sl input{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:18px;cursor:pointer}
.sl input::-webkit-slider-runnable-track{height:2px;background:var(--line-2)}
.sl input::-moz-range-track{height:2px;background:var(--line-2)}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ink);border:1.5px solid var(--blue);margin-top:-6px}
.sl input::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ink);border:1.5px solid var(--blue)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;align-self:flex-end;flex-wrap:wrap}
.seg button{background:none;border:none;color:var(--ivory-3);font-family:var(--f-body);font-size:12.5px;padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--blue-soft);color:var(--blue)}
.gridl{stroke:var(--line);stroke-width:1}
.axt{font-family:var(--f-mono);font-size:9.5px;fill:var(--ivory-3)}
.axt.blue{fill:var(--blue)}.axt.rose{fill:var(--rose)}
.obs{fill:var(--ivory)}
.fitc{fill:none;stroke:var(--blue);stroke-width:1.6}
.bar-h{fill:var(--blue-2);opacity:.75}
.bar-d{fill:var(--ivory-4)}
.bar-d.sel{fill:var(--ivory-3)}
.bar-h.sel{fill:var(--blue);opacity:1}
.regA{fill:rgba(236,230,216,.05);stroke:var(--ivory-2);stroke-width:1}
.regB{fill:rgba(201,144,127,.05);stroke:var(--rose);stroke-width:1;stroke-dasharray:5 4}
.regB.same{fill:rgba(141,176,223,.05);stroke:var(--blue)}
.regX{fill:rgba(201,144,127,.28);stroke:none}
.regC{fill:rgba(141,176,223,.22);stroke:none}
.rlab{font-family:var(--f-body);font-size:11px;fill:var(--ivory)}
.dep{stroke:var(--ivory-3);opacity:.55;transition:opacity .3s}
.dep.cut{opacity:.08;stroke-dasharray:2 3}
.cw-bg{fill:var(--ink);stroke:var(--ivory-4);stroke-width:1}
.cw-fill{fill:var(--blue);transition:opacity .4s}
.cw-t{font-family:var(--f-mono);font-size:9.5px;fill:var(--ivory);paint-order:stroke;stroke:var(--ink);stroke-width:3px}
.cwn.prem{cursor:pointer}
.cwn.prem:hover .cw-bg{stroke:var(--blue)}
.cwn.off .cw-bg{stroke:var(--rose);stroke-dasharray:2 2}
.strike{stroke:var(--rose);stroke-width:1.2}
.loadb{display:flex;flex-direction:column;gap:8px;width:100%}
.lrow{display:grid;grid-template-columns:28px minmax(0,1fr) 42px;gap:10px;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--ivory-2);font-variant-numeric:tabular-nums}
.lrow b{font-weight:400;text-align:right}
.sepfill{fill:var(--blue-soft)}
.tr-s{fill:none;stroke:var(--blue);stroke-width:1.6}
.tr-f{fill:none;stroke:var(--rose);stroke-width:1.6;stroke-dasharray:5 3}
.dot-s{fill:var(--blue)}.dot-f{fill:var(--rose)}
.voidc{display:block;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:2px;cursor:crosshair;touch-action:none}

/* RESULTS */
.results{background:var(--ink)}
.counts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:44px;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line)}
.counts > div{padding:20px 16px 18px 0;display:flex;flex-direction:column;gap:8px;min-width:0}
.counts > div + div{padding-left:16px;border-left:1px solid var(--line)}
.counts b{font-family:var(--f-display);font-weight:300;font-size:clamp(44px,5vw,64px);line-height:.9;font-variant-numeric:tabular-nums;color:var(--ivory)}
@media (max-width:760px){.counts{grid-template-columns:repeat(2,minmax(0,1fr))}.counts > div,.counts > div + div{padding:16px 0;border-left:none;border-top:1px solid var(--line)}.counts > div:nth-child(2n){padding-left:16px;border-left:1px solid var(--line)}.counts > div:first-child,.counts > div:nth-child(2){border-top:none}}
.asof{margin-top:12px;color:var(--ivory-4)}
.life{margin-top:48px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,.9fr);border:1px solid var(--line);border-radius:4px;background:var(--ink-2)}
.life-step,.life-branch{padding:20px 18px;display:flex;flex-direction:column;gap:10px;position:relative;min-width:0}
.life-step + .life-step,.life-branch{border-left:1px solid var(--line)}
.life-step + .life-step::before{content:"";position:absolute;left:-5px;top:26px;width:9px;height:9px;border-top:1px solid var(--blue-line);border-right:1px solid var(--blue-line);transform:rotate(45deg);background:var(--ink-2)}
.life-branch{border-left:1px dashed rgba(201,144,127,.35)}
.life-top{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500}
.life-step p,.life-branch p{font-size:13.5px;color:var(--ivory-3);line-height:1.55}
@media (max-width:980px){.life{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.life-step + .life-step::before{display:none}.life-step:nth-child(odd){border-left:none}.life-step:nth-child(n+3),.life-branch{border-top:1px solid var(--line)}.life-branch{grid-column:1/-1;border-left:none}}
@media (max-width:520px){.life{grid-template-columns:minmax(0,1fr)}.life-step + .life-step{border-left:none;border-top:1px solid var(--line)}}
.tmpl{margin-top:40px;border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden}
.tabs{display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:none;background:none;border:none;color:var(--ivory-3);font-family:var(--f-body);font-size:13px;padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ivory)}
.tabs button.on{color:var(--ivory);background:rgba(236,230,216,.06)}
.tmpl-body{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;padding:24px 22px 28px;min-height:180px}
@media (max-width:640px){.tmpl-body{grid-template-columns:minmax(0,1fr)}}
.tb-l{display:flex;flex-direction:column;gap:8px}

const STOP = new Set("a an the of in on for to and or with without by from how why what which who whom whose when where could would should might may can do does did is are was were be been being there their they them this that these those it its into about after before between over under than then as at if not no more less some any much many very our your my we you i change changes changing affect affects influence influences predict predicts".split(" "));

function keyTerms(q){
  const words = q.toLowerCase().replace(/[^a-z0-9\s-]/g," ").split(/\s+/).filter(w => w.length > 2 && !STOP.has(w));
  return [...new Set(words)].slice(0,6);
}
function matchScenario(q){
  const words = keyTerms(q);
  let best = null, bestScore = 0;
  for(const s of SCENARIOS){
    let sc = 0;
    for(const w of words) if(s.keywords.some(k => k.startsWith(w) || w.startsWith(k))) sc++;
    if(sc > bestScore){ bestScore = sc; best = s; }
  }
  return { scenario: best || SCENARIOS[0], matched: !!best };
}
function buildSteps(q, s, matched){
  const terms = keyTerms(q);
  const contra = s.evidence.filter(e => e.stance === "contradicts").length;
  return [
    { label:"Parse question", detail: terms.length ? "Key terms: " + terms.join(" · ") : "No key terms found" },
    { label:"Match to sample corpus", detail: matched ? `Closest sample scenario: ${s.chip}` : `No close match. Using the default sample scenario: ${s.chip}` },
    { label:"Retrieve documents", detail: `${s.stats.retrieved} of 24 synthetic abstracts selected` },
    { label:"Extract claims", detail: `${s.stats.claims} claims, each with conditions and method` },
    { label:"Assemble knowledge graph", detail: `${s.nodes.length} concepts · ${s.edges.length} relations` },
    { label:"Search for unexamined links", detail: `${s.stats.gaps} candidate gaps · 1 ranked highest` },
    { label:"Draft hypotheses", detail: "3 drafted from the top-ranked gap" },
    { label:"Critique against evidence", detail: `1 retained · ${contra} contradicting finding${contra===1?"":"s"} flagged` },
  ];
}

/* ---------------- HERO FIGURE: Lorenz attractor ---------------- */
function Lorenz(){
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current, ctx = c.getContext("2d");
    const pts = [];
    let x = .1, y = 0, z = 0;
    const s = 10, r = 28, b = 8/3, dt = .005;
    for(let i = 0; i < 14000; i++){
      const dx = s*(y-x), dy = x*(r-z)-y, dz = x*y-b*z;
      x += dx*dt; y += dy*dt; z += dz*dt;
      if(i > 400) pts.push([x,y,z]);
    }
    const N = pts.length;
    const ivory = css("--ivory") || "#ECE6D8", blue = css("--blue") || "#8DB0DF";
    const hex = (h,a) => { const n = parseInt(h.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; };
    let W = 0, H = 0, raf = 0, visible = true;
    const size = () => {
      const rc = c.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
      W = rc.width; H = rc.height; c.width = W*d; c.height = H*d; ctx.setTransform(d,0,0,d,0,0);
    };
    size();
    const ro = new ResizeObserver(() => { size(); if(REDUCE) draw(); });
    ro.observe(c);
    let head = REDUCE ? N-1 : 4200, full = REDUCE, th = .7;
    function draw(){
      ctx.clearRect(0,0,W,H);
      const sc = Math.min(W, H*1.15) / 64, cx = W/2, cy = H/2 + H*.02;
      const ct = Math.cos(th), st = Math.sin(th);
      const P = (p) => { const X = p[0]*ct - p[1]*st, D = p[0]*st + p[1]*ct; const k = 1 + D*.005; return [cx + X*sc*k, cy - (p[2]-24)*sc*k]; };
      const drawn = full ? N : head;
      ctx.lineWidth = .55; ctx.strokeStyle = hex(ivory, .17);
      ctx.beginPath();
      for(let i = 0; i < drawn; i++){ const q = P(pts[i]); i ? ctx.lineTo(q[0],q[1]) : ctx.moveTo(q[0],q[1]); }
      ctx.stroke();
      if(!REDUCE){
        const T = 520, seg = 26;
        for(let k = T; k > 0; k -= seg){
          ctx.beginPath();
          for(let j = 0; j <= seg; j++){
            let i = head - k + j; i = ((i % N) + N) % N;
            const q = P(pts[i]); j ? ctx.lineTo(q[0],q[1]) : ctx.moveTo(q[0],q[1]);
          }
          const a = 1 - k/T;
          ctx.strokeStyle = hex(blue, .08 + a*.8); ctx.lineWidth = .6 + a*1.1; ctx.stroke();
        }
        const h = P(pts[head % N]);
        const g = ctx.createRadialGradient(h[0],h[1],0,h[0],h[1],14);
        g.addColorStop(0, hex(blue,.55)); g.addColorStop(1, hex(blue,0));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(h[0],h[1],14,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = ivory; ctx.beginPath(); ctx.arc(h[0],h[1],1.8,0,Math.PI*2); ctx.fill();
      }
    }
    function loop(){
      if(visible){
        head += full ? 7 : 22;
        if(!full && head >= N){ full = true; }
        head = full ? head % N : head;
        th += .0016;
        draw();
      }
      raf = requestAnimationFrame(loop);
    }
    draw();
    if(!REDUCE) raf = requestAnimationFrame(loop);
    const io = new IntersectionObserver(([e]) => { visible = e.isIntersecting; });
    io.observe(c);
    return () => { cancelAnimationFrame(raf); ro.disconnect(); io.disconnect(); };
  }, []);
  return <canvas ref={ref} aria-label="Animated Lorenz attractor, a chaotic trajectory traced in three dimensions"></canvas>;
}

/* ---------------- KNOWLEDGE GRAPH ---------------- */
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function Graph({ scenario, selected, onSelect }){
  const box = useRef(null);
  const [dim, setDim] = useState({ w: 640, h: 440 });
  const [pos, setPos] = useState(null);
  useEffect(() => {
    const el = box.current;
    const ro = new ResizeObserver(([e]) => { const r = e.contentRect; if(r.width > 0) setDim({ w: r.width, h: Math.max(r.height, 380) }); });
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  useEffect(() => {
    const { w, h } = dim;
    const nodes = scenario.nodes, idx = Object.fromEntries(nodes.map((n,i) => [n.id, i]));
    const rnd = mulberry(scenario.id.length * 97 + 13);
    const P = nodes.map((n,i) => { const a = i/nodes.length*Math.PI*2; return { x: w/2 + Math.cos(a)*w*.08 + (rnd()-.5)*10, y: h/2 + Math.sin(a)*h*.08 + (rnd()-.5)*10, vx:0, vy:0 }; });
    const L = Math.min(w, h) * (w < 520 ? .30 : .26);
    const padX = w < 520 ? 34 : 70, padY = 34;
    let alpha = 1, raf = 0, ticks = 0;
    const tick = () => {
      for(let i = 0; i < P.length; i++) for(let j = i+1; j < P.length; j++){
        let dx = P[j].x - P[i].x, dy = P[j].y - P[i].y; let d2 = dx*dx + dy*dy; if(d2 < 1) d2 = 1;
        const f = (L*L*.9) / d2 * alpha, d = Math.sqrt(d2);
        P[i].vx -= dx/d*f; P[i].vy -= dy/d*f; P[j].vx += dx/d*f; P[j].vy += dy/d*f;
      }
      for(const e of scenario.edges){
        const a = P[idx[e.s]], b = P[idx[e.t]];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx*dx + dy*dy) || 1;
        const f = (d - L) * .045 * alpha;
        a.vx += dx/d*f; a.vy += dy/d*f; b.vx -= dx/d*f; b.vy -= dy/d*f;
      }
      for(const p of P){
        p.vx += (w/2 - p.x) * .012 * alpha; p.vy += (h/2 - p.y) * .02 * alpha;
        p.vx *= .78; p.vy *= .78; p.x += p.vx; p.y += p.vy;
        p.x = Math.max(padX, Math.min(w - padX, p.x)); p.y = Math.max(padY, Math.min(h - padY, p.y));
      }
      alpha *= .985; ticks++;
    };
    if(REDUCE){ for(let i = 0; i < 300; i++) tick(); setPos(P.map(p => ({ x:p.x, y:p.y }))); return; }
    const loop = () => {
      tick(); tick();
      setPos(P.map(p => ({ x:p.x, y:p.y })));
      if(ticks < 300) raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, [scenario, dim.w, dim.h]);

  const idx = useMemo(() => Object.fromEntries(scenario.nodes.map((n,i) => [n.id, i])), [scenario]);
  const neigh = useMemo(() => {
    if(!selected) return null;
    const s = new Set([selected]);
    scenario.edges.forEach(e => { if(e.s === selected) s.add(e.t); if(e.t === selected) s.add(e.s); });
    return s;
  }, [selected, scenario]);

  return (
    <div className="graph-box" ref={box}>
      {pos && (
        <svg viewBox={`0 0 ${dim.w} ${dim.h}`} role="img" aria-label="Knowledge graph built from the sample corpus">
          <g>
            {scenario.edges.map((e,i) => {
              const a = pos[idx[e.s]], b = pos[idx[e.t]];
              const on = selected && (e.s === selected || e.t === selected);
              const cls = `edge ${e.kind} ${selected ? (on ? "hl" : "dim") : ""}`;
              const mx = (a.x+b.x)/2, my = (a.y+b.y)/2, dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy)||1;
              const cxp = mx - dy/d*18, cyp = my + dx/d*18;
              return (
                <g key={i}>
                  <path className={cls} d={`M${a.x},${a.y} Q${cxp},${cyp} ${b.x},${b.y}`} />
                  {e.kind === "candidate" && <text className="edge-q" x={(a.x+2*cxp+b.x)/4} y={(a.y+2*cyp+b.y)/4 - 6} textAnchor="middle">?</text>}
                </g>
              );
            })}
          </g>
          <g>
            {scenario.nodes.map((n,i) => {
              const p = pos[i];
              const right = p.x < dim.w * .62;
              const r = n.type === "gap" ? 7 : n.type === "mechanism" ? 5 : 5.5;
              const cls = `node ${n.type} ${selected === n.id ? "sel" : ""} ${neigh && !neigh.has(n.id) ? "dim" : ""}`;
              return (
                <g key={n.id} className={cls} transform={`translate(${p.x},${p.y})`}
                   tabIndex="0" role="button" aria-label={`${n.label}, ${n.type === "gap" ? "candidate gap" : n.type}`}
                   onClick={() => onSelect(n.id)} onKeyDown={(ev) => { if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); onSelect(n.id); } }}>
                  <circle r="18" fill="transparent" />
                  <circle className="halo" r={r + 7} />
                  <circle className="core" r={r} />
                  <text x={right ? 12 : -12} y="4" textAnchor={right ? "start" : "end"}>{n.label}</text>
                </g>
              );
            })}
          </g>
        </svg>
      )}
    </div>
  );
}

function Inspector({ scenario, selected }){
  const node = scenario.nodes.find(n => n.id === selected);
  if(!node) return (
    <div className="inspector"><span className="mono">Inspector</span><p style={{fontSize:14,color:"var(--ivory-3)"}}>Select a node to see its relations and the sample documents behind them.</p></div>
  );
  const name = (id) => scenario.nodes.find(n => n.id === id).label;
  const rel = scenario.edges.filter(e => e.s === node.id || e.t === node.id);
  const typeLabel = node.type === "gap" ? "Candidate gap" : node.type === "mechanism" ? "Mechanism" : "Concept";
  return (
    <div className="inspector">
      <div className="ins-head">
        <h4>{node.label}</h4>
        <span className="mono" style={node.type === "gap" ? {color:"var(--blue)"} : null}>{typeLabel} · {rel.length} relation{rel.length===1?"":"s"}</span>
      </div>
      <div className="ins-list">
        {rel.map((e,i) => {
          const other = e.s === node.id ? name(e.t) : name(e.s);
          const dir = e.s === node.id ? `${e.rel} → ${other}` : `${other} → ${e.rel}`;
          return (
            <div className="ins-item" key={i}>
              <span className={`kind ${e.kind}`}>{e.kind === "candidate" ? "Candidate" : e.kind}</span>
              <span>{dir}</span>
              <span className="src">{e.src.length ? e.src.join(", ") : "none"}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Engine(){
  const initial = SCENARIOS[0];
  const [q, setQ] = useState(initial.question);
  const [active, setActive] = useState({ s: initial, matched: true, q: initial.question, run: 0 });
  const [steps, setSteps] = useState(() => buildSteps(initial.question, initial, true));
  const [progress, setProgress] = useState(8);
  const [times, setTimes] = useState(() => buildSteps("", initial, true).map((_,i) => (0.3 + i*0.42).toFixed(1)));
  const [selected, setSelected] = useState(initial.focus);
  const timers = useRef([]);
  const running = progress < steps.length;

  const run = useCallback((text, forced) => {
    const question = text.trim() || initial.question;
    const { scenario, matched } = forced ? { scenario: forced, matched: true } : matchScenario(question);
    timers.current.forEach(clearTimeout); timers.current = [];
    const st = buildSteps(question, scenario, matched);
    const ts = st.map((_,i) => (0.2 + i*(0.35 + (i%3)*0.08) + Math.random()*0.1).toFixed(1));
    setSteps(st); setTimes(ts); setProgress(0); setSelected(null);
    setActive(a => ({ s: scenario, matched, q: question, run: a.run + 1 }));
    const gap = REDUCE ? 60 : 560;
    st.forEach((_,i) => {
      timers.current.push(setTimeout(() => {
        setProgress(i+1);
        if(i+1 === st.length) setSelected(scenario.focus);
      }, gap*(i+1) + (i===4 ? 200 : 0)));
    });
  }, []);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  const onSubmit = (e) => { e.preventDefault(); if(!running) run(q); };
  const pick = (s) => { setQ(s.question); if(!running) run(s.question, s); };

        <div className="console">

              <textarea id="question" value={q} onChange={e => setQ(e.target.value)} rows="3"
                onKeyDown={e => { if(e.key === "Enter" && (e.metaKey || e.ctrlKey)) onSubmit(e); }} />
              <div className="chips" role="group" aria-label="Sample questions">
                {SCENARIOS.map(s => <button type="button" key={s.id} className={`chip ${active.s.id === s.id ? "on" : ""}`} onClick={() => pick(s)} disabled={running}>{s.chip}</button>)}
              </div>
              <div className="qrow">
                <span className="hint">Sample corpus S-01 · 24 synthetic abstracts</span>
                <button className="btn blue" type="submit" disabled={running}>{running ? "Analysing…" : "Run analysis"} <span className="arr">→</span></button>
              </div>
            </form>
            <div className="log" aria-live="polite">
              <span className="mono" style={{paddingBottom:6}}>Analysis log</span>
              {steps.map((st,i) => {
                const state = i < progress ? "done" : i === progress ? "active" : "pending";
                return (
                  <div className={`log-row ${state}`} key={`${active.run}-${i}`}>
                    <span className="st"></span>

              <span className="mono"><b>Knowledge graph</b>{graphReady ? ` · ${active.s.nodes.length} nodes` : ""}</span>
              <span className="mono">{graphReady ? "Select a node" : "Waiting"}</span>

function gauss(r){ let u = 0; while(!u) u = r(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*r()); }

/* I. Theory formation: two-part MDL over polynomial theories (real computation, synthetic data) */
const MDL = (() => {
  const rnd = mulberry(7), n = 24, xs = [], ys = [];
  for(let i = 0; i < n; i++){ const x = -1 + 2*i/(n-1) + (rnd()-.5)*.04; xs.push(x); ys.push(1.6*x*x*x - 1.2*x + .12*gauss(rnd)); }
  const fit = (k) => {
    const m = k + 1, A = Array.from({length:m}, () => new Array(m+1).fill(0));
    for(let i = 0; i < n; i++){
      const p = []; let v = 1; for(let j = 0; j < m; j++){ p.push(v); v *= xs[i]; }
      for(let a = 0; a < m; a++){ for(let b = 0; b < m; b++) A[a][b] += p[a]*p[b]; A[a][m] += p[a]*ys[i]; }
    }
    for(let c = 0; c < m; c++){
      let pv = c; for(let r = c+1; r < m; r++) if(Math.abs(A[r][c]) > Math.abs(A[pv][c])) pv = r;
      [A[c], A[pv]] = [A[pv], A[c]];
      for(let r = 0; r < m; r++){ if(r === c) continue; const f = A[r][c]/A[c][c]; for(let q = c; q <= m; q++) A[r][q] -= f*A[c][q]; }
    }
    const coef = A.map((row,i) => row[m]/row[i]);
    const f = (x) => { let s = 0, v = 1; for(const c of coef){ s += c*v; v *= x; } return s; };
    let rss = 0; for(let i = 0; i < n; i++){ const e = ys[i] - f(xs[i]); rss += e*e; }
    const LH = (k+1) * (0.5*Math.log2(n) + 3);
    const LD = Math.max(0, n/2 * Math.log2(2*Math.PI*Math.E*(rss/n)/1e-4));
    return { f, LH, LD, T: LH + LD };
  };
  const fits = [...Array(9)].map((_,k) => fit(k));
  const best = fits.reduce((b,f,i) => f.T < fits[b].T ? i : b, 0);
  return { xs, ys, fits, best, n };
})();

/* II. Contradiction: claims as regions in condition space */
function ConflictViz(){
  const [bx, setBx] = useState(6.2);
  const [by, setBy] = useState(6.0);
  const [opp, setOpp] = useState(true);
  const W = 320, H = 240, p = 30, S = (W - p - 10)/10, SY = (H - p - 14)/10;
  const A = { x0:1.2, x1:6.0, y0:1.5, y1:6.5 };
  const B = { x0:bx-2.2, x1:bx+2.2, y0:by-2.0, y1:by+2.0 };
  const ox0 = Math.max(A.x0,B.x0), ox1 = Math.min(A.x1,B.x1), oy0 = Math.max(A.y0,B.y0), oy1 = Math.min(A.y1,B.y1);
  const overlap = ox1 > ox0 && oy1 > oy0;
  const area = overlap ? (ox1-ox0)*(oy1-oy0) : 0;
  const sepX = B.x0 >= A.x1 || B.x1 <= A.x0, sepY = B.y0 >= A.y1 || B.y1 <= A.y0;
  const RX = (x0,x1,y0,y1) => ({ x: p + x0*S, y: 14 + (10-y1)*SY, width: (x1-x0)*S, height: (y1-y0)*SY });
  let verdict, cls;
  if(!overlap){ verdict = `No shared conditions. The disagreement points to a possible moderator along ${sepX && sepY ? "θ₁ and θ₂" : sepX ? "θ₁" : "θ₂"}.`; cls = "blue"; }
  else if(opp){ verdict = `Genuine conflict: incompatible relations over a shared region of area ${area.toFixed(1)}.`; cls = "rose"; }
  else { verdict = `Corroboration: compatible relations over a shared region of area ${area.toFixed(1)}.`; cls = ""; }
  return (
    <Viz title="Fig. II · Claims as regions of condition space" tag="Abstract example"
      readout={<span className={cls}>{verdict}</span>}
      controls={<>
        <Slider id="cf-bx" label="Claim B · condition θ₁" min={2.2} max={7.8} step={0.1} value={bx} onChange={setBx} fmt={v => v.toFixed(1)} />
        <Slider id="cf-by" label="Claim B · condition θ₂" min={2} max={8} step={0.1} value={by} onChange={setBy} fmt={v => v.toFixed(1)} />
        <div className="seg" role="group" aria-label="Relation asserted by claim B">
          <button type="button" className={opp ? "on" : ""} onClick={() => setOpp(true)}>B: X decreases Y</button>
          <button type="button" className={!opp ? "on" : ""} onClick={() => setOpp(false)}>B: X increases Y</button>
        </div>
      </>}>
      <svg viewBox={`0 0 ${W} ${H}`} className="single" role="img" aria-label="Two claims drawn as rectangles over two condition variables">
        {[0,2,4,6,8,10].map(v => <g key={v}><line x1={p+v*S} x2={p+v*S} y1={14} y2={H-p+0} className="gridl"/><line x1={p} x2={W-10} y1={14+(10-v)*SY} y2={14+(10-v)*SY} className="gridl"/></g>)}

/* III. Counterfactual worlds: support propagation with graph surgery */
const CW = {
  nodes: [
    { id:"F1", x:40, y:40, prior:.92 }, { id:"F2", x:40, y:100, prior:.85 }, { id:"F3", x:40, y:160, prior:.80 }, { id:"F4", x:40, y:220, prior:.70 },
    { id:"M1", x:160, y:70 }, { id:"M2", x:160, y:140 }, { id:"M3", x:160, y:210 },
    { id:"C1", x:280, y:40 }, { id:"C2", x:280, y:100 }, { id:"C3", x:280, y:160 }, { id:"C4", x:280, y:220 },
  ],
  edges: [ ["F1","M1",.9],["F2","M1",.7],["F2","M2",.9],["F3","M2",.6],["F4","M3",.9],["M1","C1",.95],["M1","C2",.6],["M2","C2",.7],["M2","C3",.8],["M3","C3",.5],["M3","C4",.95] ],
};
function propagate(removed){
  const s = {};
  for(const n of CW.nodes){
    if(n.prior != null){ s[n.id] = removed.has(n.id) ? 0 : n.prior; continue; }
    const pa = CW.edges.filter(e => e[1] === n.id);
    s[n.id] = 1 - pa.reduce((acc,e) => acc * (1 - e[2]*s[e[0]]), 1);
  }
  return s;
}
function CounterViz(){
  const [removed, setRemoved] = useState(() => new Set(["F2"]));
  const base = useMemo(() => propagate(new Set()), []);
  const s = useMemo(() => propagate(removed), [removed]);
  const pos = Object.fromEntries(CW.nodes.map(n => [n.id, n]));
  const toggle = (id) => setRemoved(r => { const n = new Set(r); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const load = ["F1","F2","F3","F4"].map(f => { const t = propagate(new Set([f])); return { f, v: ["C1","C2","C3","C4"].reduce((a,c) => a + base[c] - t[c], 0) }; });
  const maxL = Math.max(...load.map(l => l.v));
  return (
    <Viz title="Fig. III · Counterfactual world W(¬F)" tag="Abstract example · live propagation"
      readout={<>{["C1","C2","C3","C4"].map(c => { const dlt = s[c] - base[c]; return <span key={c} className={dlt < -.15 ? "rose" : ""}>s({c}) {s[c].toFixed(2)} <i>Δ {dlt >= 0 ? "+" : "−"}{Math.abs(dlt).toFixed(2)}</i></span>; })}</>}
      controls={<div className="loadb"><span className="mono">Load-bearing score · Σ Δ over conclusions when removed alone</span>
        {load.map(l => <div key={l.f} className="lrow"><span>{l.f}</span><div className="bar"><i style={{width:`${l.v/maxL*100}%`}}></i></div><b>{l.v.toFixed(2)}</b></div>)}</div>}>
      <svg viewBox="0 0 320 260" className="single" role="img" aria-label="Dependency graph from findings to conclusions. Select a finding to remove it.">
        {["Findings","Intermediate","Conclusions"].map((t,i) => <text key={t} x={[40,160,280][i]} y="14" className="axt" textAnchor="middle">{t}</text>)}
        {CW.edges.map(([a,b,w],i) => { const A = pos[a], B = pos[b]; const dead = s[a] < .01; return <line key={i} x1={A.x} y1={A.y+12} x2={B.x} y2={B.y+12} className={`dep ${dead ? "cut" : ""}`} style={{strokeWidth: .5 + w*1.4}}/>; })}
        {CW.nodes.map(n => {
          const prem = n.prior != null, off = removed.has(n.id);
          return (
            <g key={n.id} transform={`translate(${n.x},${n.y+12})`} className={`cwn ${prem ? "prem" : ""} ${off ? "off" : ""}`}
               onClick={prem ? () => toggle(n.id) : undefined} tabIndex={prem ? 0 : undefined} role={prem ? "button" : undefined}
               aria-label={prem ? `${n.id}, ${off ? "removed" : "present"}` : undefined}
               onKeyDown={prem ? (e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(n.id); } }) : undefined}>
              <circle r="15" className="cw-bg"/>
              <circle r="15" className="cw-fill" style={{opacity: s[n.id]}}/>
              <text y="4" textAnchor="middle" className="cw-t">{n.id}</text>
              {off && <line x1="-11" y1="-11" x2="11" y2="11" className="strike"/>}
            </g>
          );
        })}
      </svg>
    </Viz>
  );
}

/* IV. Recursive criticism: toy dynamics of confidence under critique */
function CriticViz(){
  const [rho, setRho] = useState(0.68);
  const [m, setM] = useState(0.5);
  const a = 0.28, K = 14;
  const rp = (rho*m) / (rho*m + (1-rho)*(1-m));
  const run = (target) => { const out = [0.5]; for(let k = 0; k < K; k++){ const p = out[k]; out.push(p + a*(target - p)); } return out; };
  const sound = run(rp), flawed = run(1 - rp);
  const W = 320, H = 210, pl = 30, pr = 12, pt = 12, pb = 26;
  const X = k => pl + k/K*(W-pl-pr), Y = v => pt + (1-v)*(H-pt-pb);
  const path = arr => arr.map((v,k) => (k ? "L" : "M") + X(k).toFixed(1) + "," + Y(v).toFixed(1)).join("");
  const sep = sound[K] - flawed[K];
  return (
    <Viz title="Fig. IV · Confidence under recursive critique" tag="Toy model · not an experiment"
      readout={<><span>Effective reliability ρ′ = {rp.toFixed(2)}</span><span className={sep < 0 ? "rose" : sep > .3 ? "hl" : ""}>Separation at depth {K} = {sep.toFixed(2)}</span><span>Limit = 2ρ′ − 1 = {(2*rp-1).toFixed(2)}</span></>}
      controls={<>
        <Slider id="rc-rho" label="Critic reliability ρ" min={0.3} max={0.95} step={0.01} value={rho} onChange={setRho} fmt={v => v.toFixed(2)} />
        <Slider id="rc-m" label="Meta-critic accuracy m · 0.50 = none" min={0.5} max={0.95} step={0.01} value={m} onChange={setM} fmt={v => v.toFixed(2)} />
      </>}>
      <svg viewBox={`0 0 ${W} ${H}`} className="single" role="img" aria-label="Confidence trajectories for a sound and a flawed hypothesis over critique depth">
        {[0,.25,.5,.75,1].map(v => <g key={v}><line x1={pl} x2={W-pr} y1={Y(v)} y2={Y(v)} className="gridl"/><text x={pl-6} y={Y(v)+3} className="axt" textAnchor="end">{v}</text></g>)}
        {[0,7,14].map(k => <text key={k} x={X(k)} y={H-8} className="axt" textAnchor="middle">{k}</text>)}
        <text x={W-pr} y={H-8} className="axt" textAnchor="end">depth k</text>
        <path d={`${path(sound)}L${X(K)},${Y(flawed[K])}${flawed.slice().reverse().map((v,i) => "L" + X(K-i).toFixed(1) + "," + Y(v).toFixed(1)).join("")}Z`} className="sepfill"/>
        <path d={path(sound)} className="tr-s"/>
        <path d={path(flawed)} className="tr-f"/>
        <circle cx={X(K)} cy={Y(sound[K])} r="3" className="dot-s"/><circle cx={X(K)} cy={Y(flawed[K])} r="3" className="dot-f"/>
        <text x={X(K)-6} y={Y(sound[K]) - 8} className="axt blue" textAnchor="end">sound</text>
        <text x={X(K)-6} y={Y(flawed[K]) + 16} className="axt rose" textAnchor="end">flawed</text>
      </svg>
    </Viz>
  );
}

/* V. Unknown unknowns: KDE density and enclosed-void score */
const VOID_PTS = (() => {
  const r = mulberry(31), P = [];
  const cl = [[.2,.25,.06,45],[.78,.22,.07,45],[.8,.75,.06,40],[.22,.78,.05,35]];
  for(const [cx,cy,s,n] of cl) for(let i = 0; i < n; i++) P.push([cx + gauss(r)*s, cy + gauss(r)*s]);
  for(let i = 0; i < 110; i++){ const t = r()*Math.PI*2, rr = .2 + gauss(r)*.03; P.push([.5 + Math.cos(t)*rr*1.15, .5 + Math.sin(t)*rr]); }
  return P.filter(p => p[0] > 0 && p[0] < 1 && p[1] > 0 && p[1] < 1);
})();
function VoidViz(){
  const ref = useRef(null);
  const [h, setH] = useState(0.05);
  const [showV, setShowV] = useState(true);
  const [probe, setProbe] = useState(null);
  const grid = useRef(null);
  useEffect(() => {
    const GX = 80, GY = 60, rho = new Float32Array(GX*GY);
    for(let j = 0; j < GY; j++) for(let i = 0; i < GX; i++){
      const x = (i+.5)/GX, y = (j+.5)/GY; let s = 0;
      for(const p of VOID_PTS){ const dx = (x-p[0])/h, dy = (y-p[1])/h; const d2 = dx*dx + dy*dy; if(d2 < 16) s += Math.exp(-d2/2); }
      rho[j*GX+i] = s / (VOID_PTS.length * 2*Math.PI*h*h);
    }
    const at = (x,y) => { const i = Math.max(0, Math.min(GX-1, Math.floor(x*GX))), j = Math.max(0, Math.min(GY-1, Math.floor(y*GY))); return rho[j*GX+i]; };
    let mx = 0; for(const v of rho) mx = Math.max(mx, v);
    const vs = new Float32Array(GX*GY), R = 2.2*h;
    for(let j = 0; j < GY; j++) for(let i = 0; i < GX; i++){
      const x = (i+.5)/GX, y = (j+.5)/GY; let ring = 0, minr = Infinity;
      for(let q = 0; q < 12; q++){ const t = q/12*Math.PI*2; const v = at(x + Math.cos(t)*R, y + Math.sin(t)*R); ring += v; minr = Math.min(minr, v); }
      ring /= 12;
      vs[j*GX+i] = Math.max(0, Math.min(ring, minr*2.2) - rho[j*GX+i]) / mx;
    }
    grid.current = { GX, GY, rho, vs, mx };
    const c = ref.current, ctx = c.getContext("2d"), d = Math.min(window.devicePixelRatio || 1, 2);
    const rc = c.getBoundingClientRect(), W = rc.width, H = rc.height;
    c.width = W*d; c.height = H*d; ctx.setTransform(d,0,0,d,0,0); ctx.clearRect(0,0,W,H);
    const iv = css("--ivory") || "#ECE6D8", bl = css("--blue") || "#8DB0DF";
    const rgb = hx => { const n = parseInt(hx.slice(1),16); return [n>>16&255, n>>8&255, n&255]; };
    const [ir,ig,ib] = rgb(iv), [br,bg,bb] = rgb(bl);
    const cw = W/GX, ch = H/GY;
    for(let j = 0; j < GY; j++) for(let i = 0; i < GX; i++){
      const v = rho[j*GX+i]/mx;
      ctx.fillStyle = `rgba(${ir},${ig},${ib},${(Math.pow(v,.7)*.32).toFixed(3)})`;
      ctx.fillRect(i*cw, (GY-1-j)*ch, cw+.5, ch+.5);
      if(showV){ const w = vs[j*GX+i]; if(w > .1){ ctx.fillStyle = `rgba(${br},${bg},${bb},${Math.min(.75, w*1.6).toFixed(3)})`; ctx.fillRect(i*cw, (GY-1-j)*ch, cw+.5, ch+.5); } }
    }
    ctx.fillStyle = `rgba(${ir},${ig},${ib},.85)`;
    for(const p of VOID_PTS){ ctx.beginPath(); ctx.arc(p[0]*W, (1-p[1])*H, 1.1, 0, Math.PI*2); ctx.fill(); }
  }, [h, showV]);
  const onMove = (e) => {
    const g = grid.current; if(!g) return;
    const rc = ref.current.getBoundingClientRect();
    const x = (e.clientX - rc.left)/rc.width, y = 1 - (e.clientY - rc.top)/rc.height;
    const i = Math.max(0, Math.min(g.GX-1, Math.floor(x*g.GX))), j = Math.max(0, Math.min(g.GY-1, Math.floor(y*g.GY)));
    setProbe({ x, y, r: g.rho[j*g.GX+i]/g.mx, v: g.vs[j*g.GX+i] });
  };
  return (
    <Viz title="Fig. V · Density and enclosed voids in an embedding" tag="Live computation · synthetic points"
      readout={probe ? <><span>x = ({probe.x.toFixed(2)}, {probe.y.toFixed(2)})</span><span>ρ̂ = {probe.r.toFixed(2)}</span><span className={probe.v > .1 ? "hl" : ""}>v = {probe.v.toFixed(2)}{probe.v > .1 ? " · enclosed void" : ""}</span></> : <span>Point at the map to read density ρ̂ and void score v. Blue marks empty regions surrounded by dense ones.</span>}
      controls={<>
        <Slider id="uu-h" label="Kernel bandwidth h" min={0.03} max={0.09} step={0.005} value={h} onChange={setH} fmt={v => v.toFixed(3)} />
        <div className="seg" role="group" aria-label="Void overlay">
          <button type="button" className={showV ? "on" : ""} onClick={() => setShowV(true)}>Show voids</button>
          <button type="button" className={!showV ? "on" : ""} onClick={() => setShowV(false)}>Density only</button>
        </div>
      </>}>
      <canvas ref={ref} className="voidc" onPointerMove={onMove} onPointerLeave={() => setProbe(null)} aria-label="Heat map of point density with enclosed voids highlighted"></canvas>
    </Viz>
  );
}

  { k:"Run internally", d:"Executed as registered. Every deviation logged with its reason." },
  { k:"Released", d:"Code, data, seeds, outputs and environment published for replication." },
  { k:"Independently verified", d:"Reproduced by an outside party. Their report is linked in full." },
];
const FIELDS = [
  { k:"Hypothesis", items:["Question and hypothesis, stated before data are examined","Primary metric and the threshold that counts as success","Link to the timestamped pre-registration"] },
  { k:"Methodology", items:["System version, configuration, prompts and search procedures in full","Random seeds and compute used","Every deviation from the pre-registration, with reasons"] },
  { k:"Datasets", items:["Source, licence and collection cutoff date","Separation of development and evaluation data, with contamination checks","A frozen copy or an exact retrieval script"] },
  { k:"Baselines", items:["A trivial baseline: random or frequency-based","A retrieval-only baseline with no generation","The strongest published method that can be run, tuned with equal effort"] },
  { k:"Results", items:["All pre-registered metrics with confidence intervals","Results from every run, not only the best","Per-item outputs released for inspection"] },
  { k:"Limitations", items:["Threats to validity","Known failure cases","What the result does not show"] },
  { k:"Verification", items:["Status on the lifecycle above","Who verified, what they reran, and on what hardware","Any discrepancy between their numbers and ours"] },
];

            <div className="counts" role="list" aria-label="Registry counts">

const STAGES = [

  { h:"Propose", p:"Draft hypotheses with mechanism, prediction and falsifier.", io:"links → hypotheses" },
  { h:"Challenge", p:"Test each draft against contradicting evidence and rank what survives.", io:"hypotheses → shortlist" },
];

const PRINCIPLES = [
  { h:"Every claim keeps its source", p:"Any statement the system makes should trace back to the passage it came from." },
  { h:"Uncertainty is stated", p:"Confidence comes with its reasons, and low confidence is shown as clearly as high." },
  { h:"Critique is built in", p:"A separate step looks for evidence against each hypothesis before it is shown." },
  { h:"Scientists decide", p:"The output is a shortlist for expert judgement and experiment, never a conclusion." },
];
